  The validator's out-of-band sum check (flag code SUM_CHECK in validation.py) is only a warning, so a
  record whose amount_total is far outside the band around its line-item sum still ships with HIGH
  confidence and no review. Make the two failing tests in tests/test_core.py pass without breaking the
  suite: an out-of-band total must route the record to review. Local-only; no hosting, no CI.
