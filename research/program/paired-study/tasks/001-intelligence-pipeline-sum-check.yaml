held_out_intent: >
  Two cases the builder does not see: a total just below the lower band edge (ratio 0.99) must also route to
  review, and an in-band gross total (ratio 1.2, tax headroom) must stay HIGH with no flag. Together they
  separate the intended fix (promote the out-of-band severity) from an over-broad one (flag every mismatch).
